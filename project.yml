name: HermesRemote
options:
  bundleIdPrefix: jp.personal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 84AL8XW4FZ
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.14.0
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.12.3
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  SwiftNIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    exactVersion: 0.3.4
targets:
  HermesRemote:
    type: application
    platform: iOS
    sources:
      - HermesRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.personal.HermesRemote
        PRODUCT_NAME: HermesRemote
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: HermesRemote/Info.plist
        CODE_SIGN_ENTITLEMENTS: HermesRemote/HermesRemote.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: SwiftCrypto
        product: Crypto
      - package: SwiftNIO
        product: NIO
      - package: SwiftNIOSSH
        product: NIOSSH
  HermesRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HermesRemoteTests
    dependencies:
      - target: HermesRemote
      - package: SwiftCrypto
        product: Crypto
  HermesRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HermesRemoteUITests
    dependencies:
      - target: HermesRemote
schemes:
  HermesRemote:
    build:
      targets:
        HermesRemote: all
        HermesRemoteTests: [test]
        HermesRemoteUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HermesRemoteTests
        - HermesRemoteUITests
